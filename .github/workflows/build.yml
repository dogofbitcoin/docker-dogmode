name: build

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dogofbitcoin/bitcoin
  # One tag per packaging revision. Builds of this commit reproduce the same program sums (three builds compared,
  # 2026-09-14), but the image digest changes with build times, so republishing a tag hands anyone who pinned it a
  # different image: 31.1-dogmode-7503240 was published twice on 2026-09-05 that way. r2 is the same programs with
  # their license files. Only a pushed git tag or a manual run publishes, never a push to main, and either one
  # publishes TAG again, so a new packaging revision changes TAG first.
  TAG: 31.1-dogmode-7503240-r2
  DOGMODE_COMMIT: 75032400914250c7ad857dc29043761680a66485

# Every action is pinned to a full commit, its release in the comment. A tag can be moved to other code later; a
# commit cannot. Each commit was read from the action's own repository on 2026-09-22 and is the one GitHub resolved
# for the build of 2026-09-15. The checkout keeps no token, because no later step uses git.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          build-args: |
            DOGMODE_COMMIT=${{ env.DOGMODE_COMMIT }}
      - name: what was built
        run: |
          docker pull "$IMAGE:$TAG-${{ matrix.arch }}" >/dev/null
          docker run --rm "$IMAGE:$TAG-${{ matrix.arch }}" --version | head -1
          docker run --rm --entrypoint cat "$IMAGE:$TAG-${{ matrix.arch }}" /SHA256SUMS

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: one tag for both architectures
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          echo "== manifest list (pin this digest in the Umbrel package) =="
          docker buildx imagetools inspect "$IMAGE:$TAG"
