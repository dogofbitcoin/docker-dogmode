name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dogofbitcoin/bitcoin
  TAG: 31.1-dogmode-7503240
  DOGMODE_COMMIT: 75032400914250c7ad857dc29043761680a66485

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          build-args: |
            DOGMODE_COMMIT=${{ env.DOGMODE_COMMIT }}
      - name: regtest smoke tests
        timeout-minutes: 5
        run: bash test/smoke.sh "$IMAGE:$TAG-${{ matrix.arch }}"
      - uses: docker/login-action@v3
        if: github.repository == 'dogofbitcoin/docker-dogmode' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish tested image
        if: github.repository == 'dogofbitcoin/docker-dogmode' && github.event_name != 'pull_request'
        run: docker push "$IMAGE:$TAG-${{ matrix.arch }}"

  manifest:
    if: github.repository == 'dogofbitcoin/docker-dogmode' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: one tag for both architectures
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          echo "== manifest list (pin this digest in the Umbrel package) =="
          docker buildx imagetools inspect "$IMAGE:$TAG"
